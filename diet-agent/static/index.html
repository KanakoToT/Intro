<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダイエット応援チーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f7f5f0;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      padding: 14px 18px;
      background: #fff;
      border-bottom: 1px solid #e5e0d5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 17px; }
    header .actions { display: flex; gap: 8px; }
    header button, header a {
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid #cbbfa8;
      border-radius: 8px;
      background: #fff;
      color: #6b5d43;
      cursor: pointer;
      text-decoration: none;
    }
    #status { padding: 8px 18px; font-size: 12px; color: #8a7f6a; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
    .user { align-self: flex-end; background: #4a7c59; color: #fff; border-bottom-right-radius: 4px; }
    .team { align-self: flex-start; background: #fff; border: 1px solid #e5e0d5; border-bottom-left-radius: 4px; }
    .info { align-self: center; font-size: 12px; color: #8a7f6a; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      background: #fff;
      border-top: 1px solid #e5e0d5;
    }
    input[type=text] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbbfa8;
      border-radius: 10px;
      font-size: 14px;
    }
    form button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #4a7c59;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    form button:disabled { opacity: 0.5; }
    #photoBtn { background: #fff; border: 1px solid #cbbfa8; color: #6b5d43; padding: 10px 12px; }
    #preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: #fff;
      border-top: 1px solid #e5e0d5;
      font-size: 12px;
      color: #6b5d43;
    }
    #preview img { height: 48px; border-radius: 8px; }
    #preview button { border: none; background: none; cursor: pointer; color: #b00; }
    .msg img.meal-photo { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>🏋️🥗🌸 ダイエット応援チーム</h1>
    <div class="actions">
      <a href="/auth/login" id="connect">Google Health接続</a>
      <button id="sync">データ同期</button>
    </div>
  </header>
  <div id="status"></div>
  <div id="chat">
    <div class="msg team">🌸 サクラ: こんにちは!私たち3人があなたのダイエットをサポートします✨
食べたもの・運動・体重、なんでも報告してくださいね。
🥗 ミドリ: 食べたものを言葉で教えるか、📷ボタンで写真を送ってください。カロリーを推定して記録します。
🏋️ ケンジ: 歩数や運動の相談も任せてくれ!</div>
  </div>
  <div id="preview">
    <img id="previewImg" alt="送信する写真">
    <span>写真を送信します</span>
    <button type="button" id="clearPhoto">✕ 取り消す</button>
  </div>
  <form id="form">
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    <button type="button" id="photoBtn" title="食事の写真を撮る/選ぶ">📷</button>
    <input type="text" id="input" placeholder="例: お昼にカツ丼と味噌汁を食べました" autocomplete="off">
    <button type="submit" id="send">送信</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    const photoInput = document.getElementById("photo");
    const photoBtn = document.getElementById("photoBtn");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    let pendingImage = null; // データURL (リサイズ済みJPEG)

    function addMsg(text, cls, imageUrl) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "meal-photo";
        img.src = imageUrl;
        div.appendChild(img);
      }
      if (text) div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // 写真は最大1024pxに縮小してJPEG化(通信量とAPIコストを抑える)
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const max = 1024;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    photoBtn.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0];
      if (!file) return;
      pendingImage = await resizeImage(file);
      previewImg.src = pendingImage;
      preview.style.display = "flex";
      input.placeholder = "写真についてひとこと(任意)";
      input.focus();
    });

    document.getElementById("clearPhoto").addEventListener("click", () => {
      pendingImage = null;
      photoInput.value = "";
      preview.style.display = "none";
      input.placeholder = "例: お昼にカツ丼と味噌汁を食べました";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text && !pendingImage) return;
      const image = pendingImage;
      addMsg(text, "user", image);
      input.value = "";
      pendingImage = null;
      photoInput.value = "";
      preview.style.display = "none";
      input.placeholder = "例: お昼にカツ丼と味噌汁を食べました";
      send.disabled = true;
      const waiting = addMsg(image ? "🥗 ミドリが写真を見ています…" : "チームが考えています…", "info");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, image: image }),
        });
        const data = await res.json();
        waiting.remove();
        addMsg(data.reply, "team");
        if (data.meal_logged) addMsg("📝 食事を記録しました", "info");
      } catch (err) {
        waiting.textContent = "エラーが発生しました: " + err;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    document.getElementById("sync").addEventListener("click", async () => {
      status.textContent = "Google Healthから同期中…";
      try {
        const res = await fetch("/api/sync", { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "同期に失敗しました");
        let msg = `同期完了: 体重${data.weights}件 / 歩数${data.steps}件`;
        if (data.errors && data.errors.length) msg += " ⚠ " + data.errors.join(" / ");
        status.textContent = msg;
      } catch (err) {
        status.textContent = "" + err;
      }
    });

    // 接続状態の表示
    fetch("/api/health-status").then(r => r.json()).then(s => {
      if (!s.configured) {
        status.textContent = "⚠ Google連携未設定(.envにGOOGLE_CLIENT_ID等を設定してください)。チャットと食事記録は使えます。";
      } else if (s.connected) {
        status.textContent = "✅ Google Health接続済み";
      }
    });
  </script>
</body>
</html>
